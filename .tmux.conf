##### -----------------------------------------------------------
##### Terminal & Display Settings
##### -----------------------------------------------------------

# Describe the terminal capabilities provided by tmux.
set -g default-terminal "tmux-256color"

# Truecolor support for st, xterm, alacritty
set -as terminal-overrides ',st-256color:Tc'
set -as terminal-overrides ',xterm*:Tc'
set -as terminal-overrides ',alacritty:Tc'

set -g allow-passthrough on
set -ga terminal-features ',xterm*:sixel'

# Allow enough time for terminal escape sequences to arrive intact
set -sg escape-time 500

# Do not display bell notifications in the tmux status line
set -g visual-bell off

# Improve responsiveness when resizing panes/windows
setw -g aggressive-resize on

# Scrollback size
set -g history-limit 20000

# Allow apps like mc and vim to use alternate screen
setw -g alternate-screen on

##### -----------------------------------------------------------
##### Mouse & Copy-Mode Behavior
##### -----------------------------------------------------------

# Enable mouse (scrolling, selecting, resizing)
set -g mouse on

# Use vi keys in copy-mode
setw -g mode-keys vi

# Use terminal default colors for tmux messages/reload notifications
# Keeps tmux visually minimal like a normal terminal
set -g message-style bg=default,fg=default

# Auto-copy and exit copy-mode on mouse selection release
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

##### -----------------------------------------------------------
##### Clipboard Integration (X11)
##### -----------------------------------------------------------

# Sync tmux clipboard with system clipboard (OSC 52 where supported)
set -g set-clipboard on

# Yank (vi-style) to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# Paste from system clipboard
bind p run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

##### -----------------------------------------------------------
##### Reload Config
##### -----------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### -----------------------------------------------------------
##### Status Bar
##### -----------------------------------------------------------

# Show the status bar at the bottom using a black monochrome style.
set -g status on
set -g status-position bottom
set -g status-style bg=black,fg=white

# Keep the left side empty; show only the date and time on the right.
set -g status-left ""
set -g status-interval 2
#set -g status-right-length 80
#set -g status-right "%H:%M %d-%b-%y"
set -g status-right ""

# Show each tmux window by number and its automatically updated name.
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #[bold]#I:#W '

# Remove the optional second status line.
set -gu status-format[1]
